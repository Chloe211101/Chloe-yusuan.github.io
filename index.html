<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🏭 生产预算管理系统 · 实时协作版</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>
    <style>
        /* 样式保持不变，与之前一致，此处省略以节省篇幅，实际部署请使用完整样式 */
        /* 您可以直接使用之前的样式，或从原文件复制 */
        :root {
            --primary: #1E3A8A;
            --primary-light: #3B82F6;
            --primary-dark: #1E2A5A;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --bg: #F3F6FC;
            --card-bg: #FFFFFF;
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
            --text-light: #9CA3AF;
            --border: #E5E7EB;
            --shadow: 0 4px 20px rgba(30, 58, 138, 0.08);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s ease;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: calc(80px + var(--safe-bottom));
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 4px;
        }
        .container {
            max-width: 1024px;
            margin: 0 auto;
            padding: 0 16px;
        }
        .app-header {
            background: var(--primary);
            color: #fff;
            padding: 16px 0 14px;
            position: sticky;
            top: 0;
            z-index: 20;
            box-shadow: 0 4px 20px rgba(30, 58, 138, 0.3);
        }
        .app-header .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .app-header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-header h1 small {
            font-size: 14px;
            font-weight: 400;
            opacity: 0.8;
            margin-left: 4px;
        }
        .app-header .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .app-header .header-date {
            font-size: 14px;
            opacity: 0.85;
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 16px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        .sync-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 14px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            font-weight: 500;
        }
        .sync-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s;
        }
        .sync-status .dot.online {
            background: #4ADE80;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
        }
        .sync-status .dot.offline {
            background: #F87171;
            box-shadow: 0 0 8px rgba(248, 113, 113, 0.6);
            animation: pulse 1.5s infinite;
        }
        .sync-status .dot.syncing {
            background: #FBBF24;
            animation: pulse 0.8s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }
        .page {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin: 20px 0 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            flex-wrap: wrap;
        }
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 20px;
            margin-bottom: 16px;
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: 0 8px 30px rgba(30, 58, 138, 0.12);
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .btn {
            border: none;
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-success:hover {
            background: #059669;
        }
        .btn-warning {
            background: var(--warning);
            color: #fff;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            transition: var(--transition);
            background: #fff;
            color: var(--text-primary);
            outline: none;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            background: var(--bg);
            text-align: left;
            padding: 10px 12px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border);
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tr:hover td {
            background: #FAFBFF;
        }
        .tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .tag-warning {
            background: #FEF3C7;
            color: #92400E;
        }
        .tag-danger {
            background: #FEE2E2;
            color: #991B1B;
        }
        .tag-success {
            background: #D1FAE5;
            color: #065F46;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-bar .fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s;
        }
        .fill.green {
            background: var(--success);
        }
        .fill.yellow {
            background: var(--warning);
        }
        .fill.red {
            background: var(--danger);
        }
        .alert-card {
            border-left: 4px solid var(--warning);
            padding: 12px 16px;
            background: #FFFBEB;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
        }
        .alert-card.danger {
            border-left-color: var(--danger);
            background: #FEF2F2;
        }
        .alert-card.success {
            border-left-color: var(--success);
            background: #ECFDF5;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.25s ease;
            padding: 16px;
        }
        .modal-overlay.show {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: var(--radius);
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px 28px;
            animation: slideUp 0.3s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-content .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 24px;
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .modal-content .modal-close:hover {
            background: var(--bg);
        }
        .modal-content h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 18px;
            padding-right: 30px;
        }
        .modal-content .text-muted {
            color: var(--text-light);
        }
        .modal-content .text-small {
            font-size: 13px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0 calc(6px + var(--safe-bottom));
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.06);
            border-top: 1px solid var(--border);
            z-index: 50;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.96);
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            font-size: 12px;
            color: var(--text-light);
            cursor: pointer;
            padding: 4px 12px;
            transition: var(--transition);
            gap: 2px;
            font-weight: 500;
        }
        .bottom-nav .nav-item .nav-icon {
            font-size: 22px;
            line-height: 1.2;
        }
        .bottom-nav .nav-item.active {
            color: var(--primary);
        }
        .bottom-nav .nav-item .nav-label {
            font-size: 10px;
            letter-spacing: 0.3px;
        }
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text-primary);
            color: #fff;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 200;
            pointer-events: none;
            white-space: nowrap;
            max-width: 90%;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: var(--success);
        }
        .toast.error {
            background: var(--danger);
        }
        .toast.warning {
            background: var(--warning);
        }
        .batch-card {
            border-left: 4px solid var(--primary-light);
            margin-bottom: 12px;
            padding: 14px 16px;
            background: #FAFBFF;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            cursor: pointer;
        }
        .batch-card:hover {
            background: #F0F5FF;
        }
        .batch-card .batch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .batch-card .batch-name {
            font-weight: 700;
            font-size: 16px;
        }
        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
        }
        .category-item:last-child {
            border-bottom: none;
        }
        .category-item .cat-name {
            font-weight: 500;
        }
        .category-item .cat-usage {
            font-size: 12px;
            color: var(--text-light);
            margin-right: 12px;
        }
        @media (max-width: 640px) {
            .app-header h1 {
                font-size: 18px;
            }
            .app-header h1 small {
                font-size: 12px;
            }
            .container {
                padding: 0 12px;
            }
            .modal-content {
                padding: 20px 16px;
            }
            .table-wrap {
                font-size: 12px;
            }
            th,
            td {
                padding: 6px 8px;
            }
            .sync-status {
                font-size: 11px;
                padding: 2px 10px;
            }
            .sync-status .dot {
                width: 8px;
                height: 8px;
            }
        }
        .text-muted {
            color: var(--text-light);
        }
        .text-small {
            font-size: 13px;
        }
        .share-banner {
            background: #ECFDF5;
            border: 1px solid #A7F3D0;
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 14px;
            color: #065F46;
        }
        .share-banner .copy-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 4px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
        }
        .share-banner .copy-btn:hover {
            background: var(--primary-dark);
        }
        .share-banner .url-display {
            flex: 1;
            min-width: 180px;
            font-size: 13px;
            word-break: break-all;
            background: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #A7F3D0;
        }
        .note-cell {
            font-size: 13px;
            color: var(--text-secondary);
            max-width: 150px;
            word-break: break-word;
        }
    </style>
</head>
